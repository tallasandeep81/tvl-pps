<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planning board — TVL Production Planning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>

<header class="bar">
  <h1>Trans Valves <span>Production Planning</span></h1>
  <nav>
    <a href="index.html" aria-current="page">Planning board</a>
    <a href="actual.html">Shift entry</a>
    <a href="dashboard.html">Plan vs actual</a>
  </nav>
  <span class="who">Planner: <b id="who">—</b></span>
</header>

<div class="toolbar" id="toolbar">
  <div class="tabs" id="tabs" role="tablist"></div>

  <div class="weeknav">
    <button class="btn" id="prevWeek" title="Previous week">‹</button>
    <input type="date" id="weekDate" aria-label="Week starting">
    <button class="btn" id="nextWeek" title="Next week">›</button>
    <select id="dayCount" aria-label="Days shown">
      <option value="5">5 days</option>
      <option value="6">6 days</option>
      <option value="7">7 days</option>
    </select>
  </div>

  <button class="btn" id="copyBtn">Copy last week</button>
  <button class="btn" id="printBtn">Print</button>

  <span class="spacer"></span>
  <span class="mono" id="dirtyCount" style="font-size:13px;color:#47535e"><span class="dirty-dot"></span>All saved</span>
  <button class="btn btn--primary" id="saveBtn" disabled>Save plan</button>
</div>

<main>
  <div id="board"><p class="loading">Loading…</p></div>

  <div class="panels">
    <section class="panel">
      <h2>Load and coverage <span class="mono" id="load" style="font-weight:400;color:#7b8792;font-size:13px"></span></h2>
      <div class="body" id="coverage"></div>
    </section>
    <section class="panel">
      <h2>Things to fix <span class="mono" id="issueCount" style="color:#a32218"></span></h2>
      <div class="body issues" id="issues"></div>
    </section>
  </div>
</main>

<script src="config.js"></script>
<script src="app.js"></script>
<script src="planner.js"></script>
</body>
</html>
